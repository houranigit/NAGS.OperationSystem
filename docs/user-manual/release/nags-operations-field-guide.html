,body:`Administration, account settings, notifications, and Master Data remain available according to existing access.`}],callouts:[{tone:`info`,title:`Operational workflows are deferred`,body:`Work orders (WO), operational history, handover, approvals, status changes, Return to Ramp, exports, and Operations analytics are unavailable in this scheduling baseline.`},{tone:`info`,title:`Android flight access`,body:`The Android app supports flight viewing and employee invitations. Use the portal for single-flight and batch scheduling and planning edits. Connect to load current flight records and send invitations.`}],sectionId:`get-started`,categoryId:`quick-start`,audience:`all`,location:`Portal and Android`,screenshotKey:`portal-login`},{id:`schedule-flight`,title:`Create a flight`,eyebrow:`Single flight`,summary:`Enter the planned flight details, choose services, and optionally assign station staff.`,keywords:[`flight`,`create`,`customer`,`station`,`services`,`staff`],steps:[{id:`open`,title:`Open the form`,body:`In Operations → Flights, select Schedule flight.`},{id:`details`,title:`Enter flight details`,body:`Select customer, station, operation type, and optional aircraft type. Enter the flight number and scheduled arrival and departure using the selected station’s configured time zone. Departure must be after arrival. Ad Hoc is not available for scheduled flights.`},{id:`services`,title:`Choose planned services`,body:`Select at least one service. Aircraft Per Landing must be the only service when selected.`},{id:`staff`,title:`Choose staff and save`,body:`If you have assignment permission, choose staff from the selected station. A Per Landing flight is scheduled without assigned staff. Select Schedule flight to create the record.`}],callouts:[{tone:`info`,title:`Use the station clock`,body:`Scheduling and operation inputs in both apps use the flight station’s configured time zone. Flight times use the same station clock, independently of device settings. The backend stores instants in UTC.`}],sectionId:`flight-operations`,categoryId:`scheduling`,audience:`portal`,location:`Operations → Flights`},{id:`schedule-many-flights`,title:`Schedule many flights`,eyebrow:`Batch scheduling`,summary:`Create flights with shared planning details on selected calendar dates.`,keywords:[`batch`,`schedule flights`,`calendar`,`weekdays`,`time zone`],steps:[{id:`open`,title:`Open Schedule flights`,body:`Select Schedule flights from the Flights grid.`},{id:`common`,title:`Set the shared details`,body:`Choose customer, station, operation type, optional aircraft type, and flight number. Select the date period, weekdays, and arrival and departure clock times.`},{id:`dates`,title:`Review the dates`,body:`The calendar step starts with dates matching the weekdays. Select or clear individual dates inside the period. At least one date is required.`},{id:`save`,title:`Select services and staff, then schedule`,body:`Choose the planned services and permitted station staff. Select Schedule flights. The grid refreshes after the batch is accepted.`}],callouts:[{tone:`tip`,title:`Overnight departures`,body:`When the departure clock time is at or before arrival, batch scheduling uses the following day for departure. Each selected date and clock time is interpreted in the selected station’s configured time zone using that date’s daylight-saving rules, then stored in UTC. Invalid or ambiguous daylight-saving times are rejected.`}],sectionId:`flight-operations`,categoryId:`scheduling`,audience:`portal`,location:`Operations → Flights → Schedule flights`},{id:`find-edit-flight`,title:`Find and edit scheduled flights`,eyebrow:`Flights grid`,summary:`Filter the list and update the planning fields through Edit schedule.`,keywords:[`search`,`filter`,`grid`,`edit`,`assignment`,`flight number`],steps:[{id:`find`,title:`Find the flight`,body:`Search by flight number, customer, or ID. Narrow the grid by station, customer, operation type, and date range. Use paging and sorting for longer lists.`},{id:`edit`,title:`Open Edit schedule`,body:`Open the row action menu and select Edit schedule. This action requires update permission.`},{id:`save`,title:`Save the planned changes`,body:`Review the flight number, schedule, aircraft type, planned services, and staff assignments and save. Customer, station, and operation type are fixed after creation. If another user changed the flight, reload its current version before retrying.`}],callouts:[{tone:`info`,title:`Planning only`,body:`There is no status column, flight-history page, work-order menu, or operational lifecycle action in this baseline.`}],sectionId:`flight-operations`,categoryId:`scheduling`,audience:`portal`,location:`Operations → Flights`},{id:`android-browse-flights`,title:`Find and view flights on Android`,eyebrow:`Flight register`,summary:`Search the flights you can access, refresh the list, and open the basic planned details.`,keywords:[`android`,`mobile`,`flights`,`search`,`refresh`,`load more`,`details`,`planned services`,`assigned staff`],steps:[{id:`sign-in`,title:`Sign in and open Flights`,body:`Use your existing account and complete the MFA code step if prompted. Flight viewing permission is required; the app shows an access message when it is missing.`},{id:`search`,title:`Find a flight`,body:`Enter a flight number, customer, or flight ID in Search. Tap Load more when more matching records are available. The list follows the same account and station visibility rules as the portal.`},{id:`refresh`,title:`Refresh the list`,body:`Pull down or tap Refresh flights to request current records. Flights also refresh after successful flight sync and when the screen resumes. When disconnected, the app can search and page through the last successful flight snapshot for the current account; a cached-data notice identifies it.`},{id:`details`,title:`Open the flight details`,body:`Tap a flight card to view its customer, station, operation type, scheduled arrival and departure, optional aircraft type, planned services, assigned staff, and flight ID. Times use the flight station’s configured time zone. Details are saved when opened online. While offline, previously opened details remain readable with a cached-data notice; unopened details require a connection.`}],callouts:[{tone:`info`,title:`Mobile flight actions`,body:`Android provides flight viewing and permitted employee invitations. Use the portal to create flights, schedule many dates, or edit planning details.`}],sectionId:`android`,categoryId:`android-flight-tools`,audience:`mobile`,location:`Android → Flights`},{id:`android-invite-employees`,title:`Invite employees from Android`,eyebrow:`Flight staff`,summary:`Add eligible station colleagues to a flight while preserving the existing assigned staff.`,keywords:[`android`,`mobile`,`invite`,`employees`,`colleagues`,`staff`,`assignment`,`permission`,`per landing`],steps:[{id:`open`,title:`Open Invite employees`,body:`Open the flight details while connected and tap Invite employees. This action requires flight invite permission, fresh online details and eligibility, and is unavailable for Per Landing flights. Invitations cannot be sent or queued from cached details.`},{id:`choose`,title:`Choose station colleagues`,body:`Select one or more employees from the available list. Options contain active staff at the flight station who are not already assigned. Existing assigned staff remain on the flight.`},{id:`send`,title:`Send the invitations`,body:`Tap Send invitations while connected. After the server accepts the request, the app refreshes the flight details and list. Invited colleagues are added to the assigned staff; notifications follow the existing notification setup.`},{id:`refresh`,title:`Review a changed flight before retrying`,body:`If another user changed the flight, review the refreshed details and invitation options before sending again. Selected employees who are no longer available must be deselected; Refresh available employees loads the latest choices.`}],callouts:[{tone:`info`,title:`Permissions and station scope apply`,body:`An invitation adds employees to the flight. The server checks your invite permission, writable account, flight access, and the selected employees at the flight station.`}],sectionId:`android`,categoryId:`android-flight-tools`,audience:`mobile`,location:`Android → Flights → Flight details → Invite employees`},{id:`android-catalog-sync`,title:`Keep flights and catalogs synchronized`,eyebrow:`Android reference data`,summary:`Refresh the scoped flight register and local aircraft, customer, service, tool, material, general-support, ATA chapter, and station staff catalogs.`,keywords:[`mobile`,`android`,`sync`,`catalogs`,`aircraft types`,`customers`,`offline`],steps:[{id:`open`,title:`Open Sync Center`,body:`Tap the sync-status icon in the app header, or open My profile → Sync Center. The page shows network and live-channel status, the last accepted event, a Flights card, and separate catalog cards with cached counts, last successful sync time and age, duration, and any refresh error.`},{id:`refresh`,title:`Refresh the catalogs`,body:`While connected, flight changes refresh flights only; catalog changes refresh the affected catalog. Staff station or active-state changes and station active-state changes also recheck flight visibility. Unaffected catalogs keep their previous Last sync time. Last sync means the last successful fetch, even when the data has not changed. Refresh now checks flights and all catalogs, as do sign-in, foreground, reconnect, and periodic checks.`},{id:`offline`,title:`Check the last successful sync`,body:`A connection failure keeps the last successful flight and catalog caches for the current account. The displayed refresh time shows their age. Previously opened flight details can be viewed offline, but invitations need a connection. Offline records reflect the last successful access check; reconnect to apply server changes.`},{id:`access`,title:`Resolve catalog access errors`,body:`Catalog access follows your Master Data permissions. Station staff uses the current staff lookup API: station accounts receive active staff from their own station, global readers keep their existing scope, and access denied clears the staff cache. Ordinary staff changes refresh only the Station staff card; station or access changes also recheck flights. Employee invitations still load current eligible staff for the selected flight. Ask an administrator to review access errors. Signing out or changing accounts clears the shared catalog cache.`}],callouts:[{tone:`info`,title:`Catalog caching and flight access`,body:`Synchronization does not queue work orders or other changes. Flight caches contain only previously authorized basic data, and denied or no-longer-visible flights are removed during online revalidation. Sending employee invitations and opening details never saved online require a connection.`}],sectionId:`android`,categoryId:`android-flight-tools`,audience:`mobile`,location:`Android → Sync Center`},{id:`android-account-notifications`,title:`Use your Android account and notifications`,eyebrow:`Account tools`,summary:`Keep using sign-in, MFA, profile viewing, and the notification inbox alongside the flight register.`,keywords:[`android`,`mobile`,`login`,`sign in`,`MFA`,`profile`,`account`,`notifications`,`read`,`archive`,`sign out`],steps:[{id:`account`,title:`Open your account`,body:`Use the account action in the app header to view your name and email. The profile refreshes while connected. Select Sign out to end the current session.`},{id:`inbox`,title:`Open the notification inbox`,body:`Use the notification bell to view your inbox and unread count. Read or archive notifications using the available inbox actions.`},{id:`flight`,title:`Follow a flight notification`,body:`Open a flight notification to load its basic flight details. Access is checked again for the signed-in account. A schedule-level notification refreshes Flights; a flight that is no longer accessible shows an error.`}],callouts:[{tone:`info`,title:`Device notifications`,body:`System alerts follow device permissions and the configured notification service. The in-app inbox remains available through its existing account access.`}],sectionId:`android`,categoryId:`android-flight-tools`,audience:`mobile`,location:`Android → Account / Notifications`},{id:`flight-access`,title:`Flight permissions and visibility`,eyebrow:`Account scope`,summary:`Web and Android use the same backend permission and scope checks for flight requests.`,keywords:[`permission`,`view`,`schedule`,`update`,`assign`,`station`,`viewer`,`invite`,`android`,`mobile`],steps:[{id:`view`,title:`Grant flight viewing`,body:`The flight view permission opens the portal grid and Android flight list and details. A portal viewer with only that destination lands directly on Flights.`},{id:`actions`,title:`Grant the needed actions`,body:`Portal scheduling, updating, and assigning staff have separate permissions. Creating a flight with staff assignments also requires assignment permission. Android employee invitations use the separate flight invite permission; viewing a flight alone does not grant invitations.`},{id:`scope`,title:`Check account scope`,body:`System administrators and Viewer Only accounts can read across stations when granted flight viewing. Station staff remain limited to their active linked station: Per Landing flights and assigned flights are visible, with the station-wide flight-view permission widening reads at that station. Invitations require a writable account, invite permission, and access to the flight.`}],callouts:[{tone:`info`,title:`The API is authoritative`,body:`Hidden buttons are not an access boundary. An account must have the required server-side permission and scope.`}],sectionId:`access-and-oversight`,categoryId:`access`,audience:`administrator`,location:`Administration → Roles`},{id:`master-data-overview`,title:`Maintain planning reference data`,eyebrow:`Master Data`,summary:`The existing catalogs continue to supply validated references and snapshots for flight planning.`,keywords:[`master data`,`customer`,`station`,`aircraft`,`service`,`staff`,`protected system records`],steps:[{id:`find`,title:`Open the relevant catalog`,body:`Use Master Data to find customers, stations, operation types, aircraft types, services, or staff. Other existing reference catalogs remain available through their own permissions.`},{id:`review`,title:`Review before changing`,body:`Search for existing records, use stable codes, and review the record detail and existing constraints before editing or deactivating.`},{id:`station-time-zone`,title:`Choose the station time zone`,body:`When creating or editing a station, select its time zone from the searchable Time zone list. This field is required. Flight scheduling and operation date/time inputs use the station’s selected zone.`},{id:`staff`,title:`Keep station staff accurate`,body:`Check staff station and active state before assigning a flight. Flight scheduling only offers eligible staff from its selected station.`}],callouts:[{tone:`info`,title:`Protected system records`,body:`Keep the catalog’s existing system-record protections. Aircraft Per Landing remains the sole planned service for a Per Landing flight; Ad Hoc is excluded from scheduled-flight creation.`}],sectionId:`master-data`,categoryId:`catalogs`,audience:`administrator`,location:`Master Data`,screenshotKey:`master-data-services`}],m=[{id:`countries`,record:`Countries`,location:`Master Data → Countries`,keyFields:[`Official name`,`ISO alpha-2 code`],usedBy:[`Stations`,`Customers`],controls:[`Search before adding`,`Keep codes unique`,`Prefer deactivation`],screenshotKey:`master-data-countries`},{id:`stations`,record:`Stations`,location:`Master Data → Stations`,keyFields:[`IATA (3)`,`ICAO (4, optional)`,`Name`,`City`,`Country`,`Time zone (required)`],usedBy:[`Flights`,`Staff`,`Operational filters`],controls:[`Keep codes uni
