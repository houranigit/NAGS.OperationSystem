# Local development only; see docs/architecture/production-runbook.md.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: operationssystem-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - operationssystem-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      target: api
      secrets:
        - firebase_admin
    container_name: operationssystem-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=OperationsSystem;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      Identity__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Identity__Admin__Email: ${ADMIN_EMAIL:-admin@operationssystem.local}
      Identity__Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Identity__ActivationUrlBase: http://localhost:5080/activate
      Identity__PasswordResetUrlBase: http://localhost:5080/reset-password
      Identity__EmailChangeConfirmUrlBase: http://localhost:5080/confirm-email-change
      Identity__DemoData__Enabled: "false"
      Database__ApplyMigrationsOnStartup: "true"
      Notifications__Fcm__Enabled: "false"
      Notifications__Fcm__Required: "false"
      EmailSettings__EnableEmailNotifications: "false"
      OpenTelemetry__Enabled: "false"
      FileStorage__RootPath: /data/storage
      DataProtection__KeyRingPath: /data/keys
    ports:
      - "127.0.0.1:5212:8080"
    volumes:
      - operationssystem-storage:/data/storage
      - operationssystem-api-keys:/data/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  portal:
    build:
      context: .
      target: portal
    container_name: operationssystem-portal
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiProxy__BaseUrl: http://api:8080
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - operationssystem-portal-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

secrets:
  firebase_admin:
    file: ./src/Host/OperationsSystem.Api/App_Data/firebase-admin.json

volumes:
  operationssystem-sql-data:
  operationssystem-storage:
  operationssystem-api-keys:
  operationssystem-portal-keys:
