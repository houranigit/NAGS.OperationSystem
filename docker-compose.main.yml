# Standalone main-branch environment. Do not merge with the main Compose files.
name: operationssystem-main

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MAIN_SQL_PASSWORD:?Set MAIN_SQL_PASSWORD in .env.main}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:1435:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: operationssystem-main-api:local
    build:
      context: ${MAIN_DOCKER_BUILD_CONTEXT:-./artifacts/docker-main-source}
      target: api
      secrets:
        - firebase_admin
      labels:
        org.opencontainers.image.revision: ${MAIN_DOCKER_REVISION:-unknown}
        org.opencontainers.image.version: "1.0.14"
        local.branch: main
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: &branch-database "Server=sqlserver;Database=OperationsSystemMain;User Id=sa;Password=${MAIN_SQL_PASSWORD:?Set MAIN_SQL_PASSWORD in .env.main};TrustServerCertificate=True"
      ConnectionStrings__Audit: *branch-database
      ConnectionStrings__Identity: *branch-database
      ConnectionStrings__MasterData: *branch-database
      ConnectionStrings__Operations: *branch-database
      ConnectionStrings__Notifications: *branch-database
      Identity__Jwt__SigningKey: ${MAIN_JWT_KEY:?Set MAIN_JWT_KEY in .env.main}
      Identity__Admin__Email: ${MAIN_ADMIN_EMAIL:?Set MAIN_ADMIN_EMAIL in .env.main}
      Identity__Admin__Password: ${MAIN_ADMIN_PASSWORD:?Set MAIN_ADMIN_PASSWORD in .env.main}
      Identity__ActivationUrlBase: http://main.localhost:5082/activate
      Identity__PasswordResetUrlBase: http://main.localhost:5082/reset-password
      Identity__EmailChangeConfirmUrlBase: http://main.localhost:5082/confirm-email-change
      Identity__DemoData__Enabled: "false"
      Database__ApplyMigrationsOnStartup: "true"
      Messaging__OutboxDispatchEnabled: "false"
      Operations__AutoWorkOrder__Enabled: "false"
      Operations__FlightReminders__Enabled: "false"
      Notifications__Fcm__Enabled: "false"
      Notifications__Fcm__Required: "false"
      EmailSettings__EnableEmailNotifications: "false"
      OpenTelemetry__Enabled: "false"
      FileStorage__RootPath: /data/storage
      DataProtection__KeyRingPath: /data/keys
    ports:
      - "127.0.0.1:5214:8080"
    volumes:
      - storage:/data/storage
      - api-keys:/data/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  portal:
    image: operationssystem-main-portal:local
    build:
      context: ${MAIN_DOCKER_BUILD_CONTEXT:-./artifacts/docker-main-source}
      target: portal
      labels:
        org.opencontainers.image.revision: ${MAIN_DOCKER_REVISION:-unknown}
        org.opencontainers.image.version: "1.0.14"
        local.branch: main
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiProxy__BaseUrl: http://api:8080
    ports:
      - "127.0.0.1:5082:8080"
    volumes:
      - portal-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

secrets:
  firebase_admin:
    file: ./src/Host/OperationsSystem.Api/App_Data/firebase-admin.json

volumes:
  sql-data:
  storage:
  api-keys:
  portal-keys:
